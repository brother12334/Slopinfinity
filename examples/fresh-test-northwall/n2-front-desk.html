<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Northwall Bouldering · Concept 2, Front desk board</title><style>
@font-face { font-family: "Unbounded"; font-weight: 600; src: url(fonts/unbounded-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Unbounded"; font-weight: 800; src: url(fonts/unbounded-latin-800-normal.woff2) format("woff2"); }
@font-face { font-family: "Manrope"; font-weight: 500; src: url(fonts/manrope-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Manrope"; font-weight: 700; src: url(fonts/manrope-latin-700-normal.woff2) format("woff2"); }
:root { --black: #161616; --chalk: #f6f5f1; --cobalt: #2f5bd3; --ply: #d8b98b; --muted: #55524c; --disp: "Unbounded", system-ui, sans-serif; --body: "Manrope", system-ui, sans-serif; }
* { box-sizing: border-box; } body { margin: 0; font: 500 1.0625rem/1.5 var(--body); color: var(--black); background: var(--chalk); }
.btn { display: inline-flex; align-items: center; min-height: 52px; padding: 0 22px; background: var(--black); color: var(--chalk); font: 700 1rem/1 var(--body); text-decoration: none; border-radius: 999px; }
.btn.alt { background: transparent; color: var(--black); box-shadow: inset 0 0 0 2px var(--black); }

.top { display: flex; justify-content: space-between; align-items: center; padding: 22px 40px; border-bottom: 3px solid var(--black); }
.brand { font: 800 1.4rem/1 var(--disp); }
.board { display: grid; grid-template-columns: 1.1fr 1fr 1fr; border-bottom: 3px solid var(--black); }
.board > div { padding: 28px 40px; border-right: 3px solid var(--black); } .board > div:last-child { border-right: 0; }
.board h2 { font: 700 .8rem/1 var(--body); text-transform: uppercase; letter-spacing: .1em; margin: 0 0 14px; color: var(--muted); }
.big { font: 800 clamp(2.4rem, 4.4vw, 4.2rem)/0.95 var(--disp); letter-spacing: -.03em; margin: 0 0 8px; }
.board p { margin: 0; }
.strip { height: 46vh; min-height: 300px; overflow: hidden; } .strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cta { display: flex; justify-content: space-between; align-items: center; padding: 22px 40px; gap: 16px; flex-wrap: wrap; font: 600 1.4rem/1.2 var(--disp); }
@media (max-width: 760px) { .top, .cta { padding: 16px 20px; } .board { grid-template-columns: 1fr; } .board > div { border-right: 0; border-bottom: 3px solid var(--black); padding: 20px; } .big { font-size: 2.2rem; } .strip { height: 200px; min-height: 0; } .cta { font-size: 1.1rem; } }
</style></head><body><header class="top"><span class="brand">NORTHWALL</span><span>3 Foundry Lane</span></header>
<section class="board"><div><h2>Open</h2><p class="big">7 am–10 pm</p><p>Monday to Friday · 9 am–8 pm Saturday and Sunday</p></div>
<div><h2>Day pass</h2><p class="big">$22</p><p>Shoe hire $5 · 10 visits $190</p></div>
<div><h2>First visit</h2><p class="big">15 min</p><p>Safety briefing, included. No booking needed.</p></div></section>
<div class="strip"><img src="art/wall-strip.svg" alt="Illustration of a bouldering wall"></div>
<div class="cta"><span>Walk in, pay at the desk, climb.</span><a class="btn" href="#">Plan your first visit</a></div></body></html>
