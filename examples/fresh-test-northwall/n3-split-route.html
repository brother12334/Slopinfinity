<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Northwall Bouldering · Concept 3, Split route</title><style>
@font-face { font-family: "Unbounded"; font-weight: 600; src: url(fonts/unbounded-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Unbounded"; font-weight: 800; src: url(fonts/unbounded-latin-800-normal.woff2) format("woff2"); }
@font-face { font-family: "Manrope"; font-weight: 500; src: url(fonts/manrope-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Manrope"; font-weight: 700; src: url(fonts/manrope-latin-700-normal.woff2) format("woff2"); }
:root { --black: #161616; --chalk: #f6f5f1; --cobalt: #2f5bd3; --ply: #d8b98b; --muted: #55524c; --disp: "Unbounded", system-ui, sans-serif; --body: "Manrope", system-ui, sans-serif; }
* { box-sizing: border-box; } body { margin: 0; font: 500 1.0625rem/1.5 var(--body); color: var(--black); background: var(--chalk); }
.btn { display: inline-flex; align-items: center; min-height: 52px; padding: 0 22px; background: var(--black); color: var(--chalk); font: 700 1rem/1 var(--body); text-decoration: none; border-radius: 999px; }
.btn.alt { background: transparent; color: var(--black); box-shadow: inset 0 0 0 2px var(--black); }

.wrap { display: grid; grid-template-columns: 1.05fr 1fr; min-height: 100vh; }
.left { padding: 34px 48px 40px; display: flex; flex-direction: column; }
.brand { font: 800 1.2rem/1 var(--disp); margin: 0 0 auto; }
h1 { font: 800 clamp(2.6rem, 5vw, 4.6rem)/0.95 var(--disp); letter-spacing: -.035em; margin: 56px 0 26px; }
h1 span { color: var(--cobalt); }
.facts { margin: 0 0 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; }
.facts div { border-top: 3px solid var(--black); padding-top: 10px; }
dt { font: 700 .78rem/1.4 var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 4px; } dd { margin: 0; font-size: 1.05rem; } dd b { font: 800 1.6rem/1 var(--disp); }
.acts { display: flex; gap: 12px; flex-wrap: wrap; }
.right { position: relative; overflow: hidden; } .right img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
@media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } .left { padding: 20px 20px 28px; } h1 { margin: 28px 0 18px; font-size: 2.3rem; } .facts { grid-template-columns: 1fr 1fr; gap: 14px 16px; } .right { height: 260px; } }
</style></head><body><div class="wrap"><div class="left"><p class="brand">NORTHWALL</p><h1>Climb today on <span>Foundry Lane.</span></h1><dl class="facts">
  <div><dt>Hours</dt><dd>Mon–Fri 7 am–10 pm<br>Sat–Sun 9 am–8 pm</dd></div>
  <div><dt>Day pass</dt><dd><b>$22</b> · shoe hire $5</dd></div>
  <div><dt>First visit</dt><dd>15-minute safety briefing, included. No booking needed.</dd></div>
  <div><dt>Address</dt><dd>3 Foundry Lane</dd></div>
</dl><div class="acts"><a class="btn" href="#">Plan your first visit</a><a class="btn alt" href="#">Copy address</a></div></div>
<div class="right"><img src="art/wall-tall.svg" alt="Illustration of a bouldering wall"></div></div></body></html>
