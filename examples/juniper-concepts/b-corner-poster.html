<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juniper Counter · Concept B, Corner poster</title>
<style>
@font-face { font-family: "Anton"; font-weight: 400; src: url(fonts/anton-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Archivo"; font-weight: 400; src: url(fonts/archivo-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Archivo"; font-weight: 700; src: url(fonts/archivo-latin-700-normal.woff2) format("woff2"); }
:root { --paper: #f4ecd9; --green: #1f6b4a; --orange: #ff8a3d; --ink: #17271f; --poster: "Anton", Impact, sans-serif; --sans: "Archivo", system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper) url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%22.7%22 numOctaves=%223%22/%3E%3CfeColorMatrix values=%220 0 0 0 .5 0 0 0 0 .4 0 0 0 0 .25 0 0 0 .1 0%22/%3E%3C/filter%3E%3Crect width=%22200%22 height=%22200%22 filter=%22url(%23n)%22/%3E%3C/svg%3E"); color: var(--ink); font: 400 1.0625rem/1.5 var(--sans); }
.sheet { position: relative; min-height: 100vh; overflow: hidden; padding: 28px 36px 0; display: grid; grid-template-rows: auto 1fr auto; }
.tag { display: flex; justify-content: space-between; font: 700 0.85rem/1 var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--green); position: relative; z-index: 3; }
.name { position: relative; z-index: 2; font: 400 clamp(6rem, 19vw, 21rem)/0.8 var(--poster); text-transform: uppercase; color: var(--green); margin: 18px 0 0; letter-spacing: -0.01em; mix-blend-mode: multiply; }
.name span { display: block; }
.name span + span { color: var(--orange); margin-left: 0.32em; }
.bun { position: absolute; z-index: 1; right: -14vw; top: 6vh; width: 74vw; max-width: 1150px; mix-blend-mode: multiply; }
.strip { position: relative; z-index: 3; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; border-top: 6px solid var(--green); padding: 14px 0 22px; font: 400 clamp(1.3rem, 2.4vw, 2.2rem)/1.05 var(--poster); text-transform: uppercase; color: var(--green); }
.strip em { font-style: normal; color: var(--orange); }
.items { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--green); }
.item { padding: 28px 36px 40px; border-right: 1px solid var(--green); }
.item:last-child { border-right: 0; }
.item b { font: 400 1rem/1 var(--poster); color: var(--orange); letter-spacing: 0.05em; }
.item h2 { font: 400 clamp(2.4rem, 3.6vw, 3.4rem)/0.95 var(--poster); text-transform: uppercase; color: var(--green); margin: 8px 0 14px; }
.item img { width: 100%; display: block; }
footer { border-top: 6px solid var(--green); padding: 16px 36px 30px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 0.85rem; color: var(--green); }
@media (max-width: 760px) {
  .sheet { padding: 20px 20px 0; min-height: 0; }
  .name { font-size: 27vw; }
  .bun { position: relative; right: auto; top: auto; width: 150%; margin: -8vw 0 -16vw -18%; }
  .strip { flex-direction: column; font-size: 1.6rem; }
  .items { grid-template-columns: 1fr; }
  .item { border-right: 0; border-bottom: 1px solid var(--green); padding: 24px 20px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: center; }
  .item h2 { font-size: 2.2rem; }
  footer { padding: 16px 20px 28px; }
}
</style>
</head>
<body>
<section class="sheet">
  <div class="tag"><span>24 Willow Street</span><span>Wed–Sun</span></div>
  <h1 class="name"><span>Juniper</span><span>Counter</span></h1>
  <img class="bun" src="art/b-poster.svg" alt="Two-colour print illustration of a cardamom bun">
  <p class="strip"><span>Espresso · <em>Cardamom buns</em> · Egg sandwiches</span><span>8 am–3 pm · Closed Mon &amp; Tue</span></p>
</section>
<section class="items">
  <div class="item"><div><b>01</b><h2>Espresso</h2></div><img src="art/b-espresso.svg" alt="Print illustration of an espresso"></div>
  <div class="item"><div><b>02</b><h2>Cardamom buns</h2></div><img src="art/b-bun.svg" alt="Print illustration of a cardamom bun"></div>
  <div class="item"><div><b>03</b><h2>Egg sandwiches</h2></div><img src="art/b-sandwich.svg" alt="Print illustration of an egg sandwich"></div>
</section>
<footer><span>Juniper Counter · 24 Willow Street · Wednesday to Sunday, 8 am–3 pm</span><span>Concept B · illustrations drawn for this concept, not photos</span></footer>
</body>
</html>
